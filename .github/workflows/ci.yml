name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # Vite 8 requires Node 20.19+/22.12+
          cache: npm
      - run: npm ci
      - run: npm run build   # tsc strict + vite build
      - run: npm test
